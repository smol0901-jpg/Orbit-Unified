<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Контур · Диаграммы</title>
<style>
:root{--bg:#0b0f1a;--card:#121826;--line:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--font:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;max-height:100dvh;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text)}
body{display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:6px;padding:8px 10px;min-height:44px;border-bottom:1px solid var(--line);background:var(--card);flex:none;z-index:6}
header b{font-size:.9rem}
header .sp{flex:1}
header .btn{padding:7px 10px;font-size:.72rem}
.types{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg);flex:none;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.types::-webkit-scrollbar{display:none}
.types button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 12px;font:600 .74rem var(--font);white-space:nowrap;cursor:pointer}
.types button.on{background:color-mix(in srgb,var(--accent) 28%,var(--card));border-color:var(--accent);color:#c7d2fe}
main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:900px){main{flex-direction:row}}
.panel{padding:12px;overflow:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.preview{display:flex;flex-direction:column;align-items:center;padding:12px;overflow:auto;flex:1;min-height:0}
.preview svg{max-width:100%;max-height:min(40vh,300px);height:auto}
.legend{width:100%;max-width:320px;margin-top:8px;font-size:.8rem}
.leg{display:flex;gap:8px;align-items:center;margin:3px 0}.leg i{width:10px;height:10px;border-radius:3px}
label{display:block;font-size:.72rem;color:var(--muted);margin:8px 0 4px}
input,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f172a;color:var(--text);font:inherit}
.row{display:flex;gap:6px;margin:4px 0;align-items:center}.row input{flex:1}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 .82rem var(--font);cursor:pointer;background:var(--accent);color:#fff;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--card);flex:none;z-index:20}
.hint{font-size:.72rem;color:var(--muted);margin-bottom:8px}
h3{margin:0 0 6px;font-size:.9rem}
.item button.rm{border:0;background:#1e293b;color:#f87171;border-radius:8px;width:36px;height:36px;cursor:pointer}
</style>
</head>
<body>
<header>
  <b>Диаграммы</b>
  <span class="sp"></span>
  <button type="button" class="btn ghost" id="btn-dash">С дашборда</button>
  <button type="button" class="btn ghost" id="btn-new">Новая</button>
</header>
<div class="types" id="types"></div>
<main>
  <section class="panel" id="editor"></section>
  <section class="preview" id="preview"></section>
</main>
<div class="actions">
  <button type="button" class="btn" id="btn-agent">В агент</button>
  <button type="button" class="btn ghost" id="btn-png">PNG в агент</button>
  <button type="button" class="btn ghost" id="btn-copy">Копировать JSON</button>
</div>
<script>
const TYPES={
  pie:{title:'Круговая',hint:'Доли: метка и число'},
  bar:{title:'Гистограмма',hint:'Столбцы'},
  busy:{title:'Занятость',hint:'Блоки времени'},
  state:{title:'Состояния',hint:'Узлы и переходы'},
  journey:{title:'Путь',hint:'Этапы'},
  c4:{title:'C4',hint:'Контекст'}
};
const COLORS=['#6366f1','#22c55e','#f59e0b','#ec4899','#94a3b8','#38bdf8'];
let doc=null;

function defaultDoc(t){
  const id='dg'+Date.now().toString(36);
  if(t==='pie') return {id,type:'pie',title:'Круговая',slices:[{label:'A',value:40,color:COLORS[0]},{label:'B',value:30,color:COLORS[1]},{label:'C',value:30,color:COLORS[2]}]};
  if(t==='bar') return {id,type:'bar',title:'Гистограмма',bars:[{label:'Пн',value:3},{label:'Вт',value:5},{label:'Ср',value:2}]};
  if(t==='busy') return {id,type:'busy',title:'Занятость',dayStart:8,dayEnd:20,blocks:[{label:'Встречи',start:9,end:12,kind:'busy'},{label:'Свободно',start:12,end:13,kind:'free'},{label:'Фокус',start:13,end:17,kind:'busy'}]};
  if(t==='state') return {id,type:'state',title:'Состояния',states:['Старт','Процесс','Готово'],edges:[{from:'Старт',to:'Процесс',label:''},{from:'Процесс',to:'Готово',label:''}]};
  if(t==='journey') return {id,type:'journey',title:'Путь',steps:[{label:'Вход',emotion:3},{label:'Действие',emotion:4},{label:'Результат',emotion:5}]};
  return {id,type:'c4',title:'C4',system:'Система',actors:[{name:'Пользователь',desc:''}],systems:[{name:'API',desc:''}]};
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function svgPie(d){
  const slices=d.slices||[], sum=slices.reduce((a,x)=>a+(+x.value||0),0)||1;
  let a=-Math.PI/2, paths='';
  slices.forEach((s,i)=>{
    const ang=(+s.value||0)/sum*Math.PI*2, x1=100+80*Math.cos(a), y1=100+80*Math.sin(a);
    a+=ang; const x2=100+80*Math.cos(a), y2=100+80*Math.sin(a), large=ang>Math.PI?1:0;
    paths+=`<path d="M100,100 L${x1},${y1} A80,80 0 ${large} 1 ${x2},${y2} Z" fill="${s.color||COLORS[i%COLORS.length]}"/>`;
  });
  return `<svg viewBox="0 0 200 200" width="200" height="200">${paths}</svg>`;
}
function svgBar(d){
  const bars=d.bars||[], max=Math.max(1,...bars.map(b=>+b.value||0));
  const w=Math.max(200, bars.length*48), h=160;
  let g='';
  bars.forEach((b,i)=>{
    const bh=((+b.value||0)/max)*120;
    g+=`<rect x="${20+i*44}" y="${130-bh}" width="32" height="${bh}" rx="4" fill="${COLORS[i%COLORS.length]}"/>`;
    g+=`<text x="${36+i*44}" y="148" text-anchor="middle" fill="#94a3b8" font-size="10">${esc(b.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}</svg>`;
}
function svgBusy(d){
  const blocks=d.blocks||[], ds=d.dayStart||8, de=d.dayEnd||20, span=Math.max(1,de-ds);
  const w=320,h=Math.max(80, blocks.length*28+20);
  let g=`<rect x="0" y="0" width="${w}" height="${h}" fill="#0f172a" rx="8"/>`;
  blocks.forEach((b,i)=>{
    const x=((b.start-ds)/span)* (w-20)+10, ww=Math.max(8, ((b.end-b.start)/span)*(w-20));
    const col=b.kind==='free'?'#334155':'#6366f1';
    g+=`<rect x="${x}" y="${12+i*26}" width="${ww}" height="20" rx="4" fill="${col}"/>`;
    g+=`<text x="${x+4}" y="${26+i*26}" fill="#e2e8f0" font-size="10">${esc(b.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}</svg>`;
}
function svgState(d){
  const st=d.states||[], n=st.length||1;
  let g='';
  st.forEach((s,i)=>{
    const x=40+i*100;
    g+=`<rect x="${x}" y="40" width="80" height="36" rx="10" fill="#1e293b" stroke="#6366f1"/>`;
    g+=`<text x="${x+40}" y="62" text-anchor="middle" fill="#e2e8f0" font-size="11">${esc(s)}</text>`;
    if(i<n-1) g+=`<line x1="${x+80}" y1="58" x2="${x+100}" y2="58" stroke="#64748b" marker-end="url(#arrow)"/>`;
  });
  return `<svg viewBox="0 0 ${Math.max(200,n*100+40)} 120" width="100%" height="120"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker></defs>${g}</svg>`;
}
function svgJourney(d){
  const steps=d.steps||[];
  let g='';
  steps.forEach((s,i)=>{
    const x=30+i*90, em=Math.min(5,Math.max(1,+s.emotion||3));
    g+=`<circle cx="${x}" cy="50" r="18" fill="${COLORS[em-1]}"/>`;
    g+=`<text x="${x}" y="80" text-anchor="middle" fill="#94a3b8" font-size="10">${esc(s.label)}</text>`;
    if(i<steps.length-1) g+=`<line x1="${x+18}" y1="50" x2="${x+72}" y2="50" stroke="#475569"/>`;
  });
  return `<svg viewBox="0 0 ${Math.max(200,steps.length*90+20)} 100" width="100%" height="100">${g}</svg>`;
}
function svgC4(d){
  let g=`<rect x="100" y="60" width="120" height="50" rx="10" fill="#312e81"/><text x="160" y="90" text-anchor="middle" fill="#e2e8f0" font-size="12">${esc(d.system||'Система')}</text>`;
  (d.actors||[]).forEach((a,i)=>{ g+=`<rect x="10" y="${20+i*40}" width="70" height="28" rx="8" fill="#1e293b"/><text x="45" y="${38+i*40}" text-anchor="middle" fill="#94a3b8" font-size="10">${esc(a.name)}</text>`; });
  (d.systems||[]).forEach((a,i)=>{ g+=`<rect x="240" y="${20+i*40}" width="70" height="28" rx="8" fill="#1e293b"/><text x="275" y="${38+i*40}" text-anchor="middle" fill="#94a3b8" font-size="10">${esc(a.name)}</text>`; });
  return `<svg viewBox="0 0 320 160" width="100%" height="160">${g}</svg>`;
}

function renderSvg(){
  if(!doc) return '';
  const m={pie:svgPie,bar:svgBar,busy:svgBusy,state:svgState,journey:svgJourney,c4:svgC4};
  return (m[doc.type]||svgPie)(doc);
}
function legend(){
  if(!doc) return '';
  if(doc.type==='pie') return (doc.slices||[]).map(s=>`<div class="leg"><i style="background:${s.color}"></i>${esc(s.label)} · ${s.value}</div>`).join('');
  if(doc.type==='bar') return (doc.bars||[]).map((s,i)=>`<div class="leg"><i style="background:${COLORS[i%COLORS.length]}"></i>${esc(s.label)} · ${s.value}</div>`).join('');
  return '';
}
function paint(){
  document.getElementById('preview').innerHTML=renderSvg()+'<div class="legend">'+legend()+'</div>';
  try{ localStorage.setItem('contour-diagrams-current', JSON.stringify(doc)); }catch(e){}
}
function editorUI(){
  const el=document.getElementById('editor');
  if(!doc) return;
  let h=`<h3>${esc(TYPES[doc.type].title)}</h3><p class="hint">${esc(TYPES[doc.type].hint)}</p>`;
  h+=`<label>Название</label><input id="ttl" value="${esc(doc.title||'')}"/>`;
  if(doc.type==='pie'){
    h+='<div class="list" id="list">';
    (doc.slices||[]).forEach((s,i)=>{
      h+=`<div class="row item"><input data-i="${i}" data-f="label" value="${esc(s.label)}"/><input data-i="${i}" data-f="value" type="number" value="${s.value}" style="max-width:72px"/><button type="button" class="rm" data-rm="${i}">×</button></div>`;
    });
    h+='</div><button type="button" class="btn ghost" id="add">+ доля</button>';
  } else if(doc.type==='bar'){
    h+='<div class="list">';
    (doc.bars||[]).forEach((s,i)=>{
      h+=`<div class="row item"><input data-i="${i}" data-f="label" value="${esc(s.label)}"/><input data-i="${i}" data-f="value" type="number" value="${s.value}" style="max-width:72px"/><button type="button" class="rm" data-rm="${i}">×</button></div>`;
    });
    h+='</div><button type="button" class="btn ghost" id="add">+ столбец</button>';
  } else if(doc.type==='busy'){
    h+=`<label>Начало / конец дня (час)</label><div class="row"><input id="ds" type="number" value="${doc.dayStart||8}" style="max-width:80px"/><input id="de" type="number" value="${doc.dayEnd||20}" style="max-width:80px"/></div>`;
    (doc.blocks||[]).forEach((b,i)=>{
      h+=`<div class="row"><input data-i="${i}" data-f="label" value="${esc(b.label)}"/><input data-i="${i}" data-f="start" type="number" value="${b.start}" style="max-width:56px"/><input data-i="${i}" data-f="end" type="number" value="${b.end}" style="max-width:56px"/><button type="button" class="rm" data-rm="${i}">×</button></div>`;
    });
    h+='<button type="button" class="btn ghost" id="add">+ блок</button>';
  } else if(doc.type==='state'){
    h+=`<label>Состояния через запятую</label><input id="states" value="${esc((doc.states||[]).join(', '))}"/>`;
  } else if(doc.type==='journey'){
    (doc.steps||[]).forEach((s,i)=>{
      h+=`<div class="row"><input data-i="${i}" data-f="label" value="${esc(s.label)}"/><input data-i="${i}" data-f="emotion" type="number" min="1" max="5" value="${s.emotion||3}" style="max-width:56px"/></div>`;
    });
  } else {
    h+=`<label>Система</label><input id="sys" value="${esc(doc.system||'')}"/>`;
    h+=`<label>Акторы</label><input id="actors" value="${esc((doc.actors||[]).map(a=>a.name).join(', '))}"/>`;
  }
  el.innerHTML=h;
  el.querySelector('#ttl')?.addEventListener('input',e=>{ doc.title=e.target.value; paint(); });
  el.querySelectorAll('[data-i]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const i=+inp.dataset.i, f=inp.dataset.f;
      const arr=doc.slices||doc.bars||doc.blocks||doc.steps;
      if(!arr||!arr[i]) return;
      arr[i][f]=inp.type==='number'?+inp.value:inp.value;
      paint();
    });
  });
  el.querySelectorAll('[data-rm]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=+btn.dataset.rm;
      if(doc.slices) doc.slices.splice(i,1);
      else if(doc.bars) doc.bars.splice(i,1);
      else if(doc.blocks) doc.blocks.splice(i,1);
      editorUI(); paint();
    });
  });
  el.querySelector('#add')?.addEventListener('click',()=>{
    if(doc.type==='pie') doc.slices.push({label:'Новая',value:10,color:COLORS[doc.slices.length%COLORS.length]});
    else if(doc.type==='bar') doc.bars.push({label:'+',value:1});
    else if(doc.type==='busy') doc.blocks.push({label:'Блок',start:12,end:13,kind:'busy'});
    editorUI(); paint();
  });
  el.querySelector('#ds')?.addEventListener('input',e=>{ doc.dayStart=+e.target.value; paint(); });
  el.querySelector('#de')?.addEventListener('input',e=>{ doc.dayEnd=+e.target.value; paint(); });
  el.querySelector('#states')?.addEventListener('input',e=>{ doc.states=e.target.value.split(',').map(x=>x.trim()).filter(Boolean); paint(); });
  el.querySelector('#sys')?.addEventListener('input',e=>{ doc.system=e.target.value; paint(); });
  el.querySelector('#actors')?.addEventListener('input',e=>{ doc.actors=e.target.value.split(',').map(x=>({name:x.trim(),desc:''})).filter(a=>a.name); paint(); });
}

function setType(t){
  doc=defaultDoc(t);
  document.querySelectorAll('.types button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  editorUI(); paint();
}
function postToParent(kind, extra){
  try{ parent.postMessage(Object.assign({t:'dg-to-agent',kind,name:doc.title||TYPES[doc.type].title,doc},extra||{}), '*'); }catch(e){}
}

document.getElementById('types').innerHTML=Object.keys(TYPES).map(t=>`<button type="button" data-t="${t}">${TYPES[t].title}</button>`).join('');
document.getElementById('types').onclick=e=>{ const b=e.target.closest('button[data-t]'); if(b) setType(b.dataset.t); };

document.getElementById('btn-new').onclick=e=>{ e.preventDefault(); setType(doc&&doc.type||'pie'); };
document.getElementById('btn-dash').onclick=e=>{
  e.preventDefault();
  try{ parent.postMessage({t:'dg-request-dashboard',type:doc&&doc.type||'busy'},'*'); }catch(err){}
  const t=doc&&doc.type||'busy';
  if(t==='busy') Object.assign(doc, defaultDoc('busy'), {title:'Занятость · дашборд'});
  else if(t==='pie') Object.assign(doc, defaultDoc('pie'), {title:'Доли · дашборд', slices:[{label:'Встречи',value:35,color:COLORS[0]},{label:'Задачи',value:25,color:COLORS[1]},{label:'Цели',value:15,color:COLORS[2]},{label:'Свободно',value:25,color:COLORS[4]}]});
  else if(t==='bar') Object.assign(doc, defaultDoc('bar'), {title:'Неделя · дашборд'});
  editorUI(); paint();
};
document.getElementById('btn-agent').onclick=e=>{ e.preventDefault(); postToParent('json'); e.target.textContent='✓'; setTimeout(()=>e.target.textContent='В агент',1000); };
document.getElementById('btn-png').onclick=async e=>{
  e.preventDefault();
  try{
    const svg=document.querySelector('#preview svg');
    if(!svg){ postToParent('json'); return; }
    const xml=new XMLSerializer().serializeToString(svg);
    const img=new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml); });
    const c=document.createElement('canvas'); c.width=Math.max(320,img.width); c.height=Math.max(180,img.height);
    const ctx=c.getContext('2d'); ctx.fillStyle='#0b0f1a'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0);
    postToParent('png',{dataUrl:c.toDataURL('image/png')});
    e.target.textContent='PNG ✓'; setTimeout(()=>e.target.textContent='PNG в агент',1000);
  }catch(err){ console.error(err); postToParent('json'); }
};
document.getElementById('btn-copy').onclick=async e=>{
  e.preventDefault();
  try{ await navigator.clipboard.writeText(JSON.stringify(doc,null,2)); e.target.textContent='Скопировано'; setTimeout(()=>e.target.textContent='Копировать JSON',1000); }
  catch(err){ prompt('JSON', JSON.stringify(doc)); }
};

window.addEventListener('message',e=>{
  if(!e.data) return;
  if(e.data.t==='dg-open'){
    if(e.data.doc) doc=e.data.doc; else setType(e.data.type||'pie');
    document.querySelectorAll('.types button').forEach(b=>b.classList.toggle('on',b.dataset.t===doc.type));
    editorUI(); paint();
  }
  if(e.data.t==='dg-dashboard-data' && e.data.doc){
    doc=e.data.doc;
    document.querySelectorAll('.types button').forEach(b=>b.classList.toggle('on',b.dataset.t===doc.type));
    editorUI(); paint();
  }
});

try{
  const saved=JSON.parse(localStorage.getItem('contour-diagrams-current')||'null');
  doc=(saved&&saved.type)?saved:defaultDoc('pie');
}catch(e){ doc=defaultDoc('pie'); }
document.querySelectorAll('.types button').forEach(b=>b.classList.toggle('on',b.dataset.t===doc.type));
editorUI(); paint();
</script>
</body>
</html>
