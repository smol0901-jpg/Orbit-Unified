<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Контур · Диаграммы</title>
<style>
:root{--bg:#0b0f1a;--card:#121826;--line:#1e293b;--text:#e2e8f0;--muted:#94a3b8;--accent:#6366f1;--ok:#22c55e;--r:14px;--font:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--card) 90%,transparent);position:sticky;top:0;z-index:5}
header b{font-size:1rem}
header .sp{flex:1}
.types{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line)}
.types button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 12px;font:600 .78rem var(--font);cursor:pointer}
.types button.on{background:color-mix(in srgb,var(--accent) 25%,var(--card));border-color:var(--accent);color:#c7d2fe}
main{flex:1;display:grid;grid-template-columns:1fr;gap:0}
@media(min-width:800px){main{grid-template-columns:1fr 1fr}}
.panel{padding:12px;overflow:auto}
.preview{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;background:radial-gradient(ellipse at 50% 0%,#1e1b4b44,transparent 60%)}
.preview svg{max-width:100%;height:auto;filter:drop-shadow(0 8px 24px #0006)}
.legend{width:100%;max-width:320px;margin-top:12px}
.leg{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:4px 0}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
label{display:block;font-size:.75rem;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f172a;color:var(--text);font:inherit}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row input{flex:1}
.btn{border:0;border-radius:12px;padding:10px 14px;font:600 .85rem var(--font);cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr 72px 36px;gap:6px;align-items:center}
.item button{border:0;background:#1e293b;color:#f87171;border-radius:8px;height:36px;cursor:pointer}
h3{margin:0 0 8px;font-size:.95rem}
.hint{font-size:.75rem;color:var(--muted);margin-bottom:12px}
@media(max-width:600px){
  header{padding:8px 10px}
  .types{padding:6px 8px;gap:4px}
  .types button{padding:7px 10px;font-size:.72rem}
  .panel{padding:10px}
  .preview{padding:10px}
  .actions{padding:10px;gap:6px}
  .btn{padding:10px 12px;font-size:.8rem;flex:1;min-width:0}
  .item{grid-template-columns:1fr 64px 32px;gap:4px}
  input,select,textarea{padding:9px 10px;font-size:16px} /* no iOS zoom */
}
@media(min-width:800px){
  main{grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);min-height:0;flex:1}
  .panel,.preview{max-height:calc(100dvh - 140px);overflow:auto}
}
@media(min-width:1100px){
  body{max-width:1100px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <b id="title">Диаграммы</b>
  <span class="sp"></span>
  <button class="btn ghost" type="button" id="btn-new">Новая</button>
</header>
<div class="types" id="types"></div>
<main>
  <section class="panel" id="editor"></section>
  <section class="preview" id="preview"></section>
</main>
<div class="actions">
  <button class="btn" type="button" id="btn-agent">В агент</button>
  <button class="btn ghost" type="button" id="btn-png">PNG в агент</button>
  <button class="btn ghost" type="button" id="btn-copy">Копировать JSON</button>
</div>
<script>
const TYPES = {
  pie: { title: 'Круговая', hint: 'Доли: метка и число' },
  bar: { title: 'Гистограмма', hint: 'Столбцы: категория и значение' },
  busy: { title: 'Занятость дня', hint: 'Блоки времени 0–24' },
  state: { title: 'Состояния', hint: 'Узлы и переходы' },
  journey: { title: 'Путь пользователя', hint: 'Этапы и эмоция 1–5' },
  c4: { title: 'C4-контекст', hint: 'Система, акторы, системы' }
};
const COLORS = ['#6366f1','#22c55e','#f59e0b','#ec4899','#94a3b8','#38bdf8','#a78bfa'];
let doc = null;

function uid(){ return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function defaultDoc(type){
  const t = TYPES[type]?type:'pie';
  const base = { id: uid(), type: t, title: TYPES[t].title, updated: Date.now() };
  if(t==='pie') return Object.assign(base,{ slices:[{label:'A',value:40,color:COLORS[0]},{label:'B',value:30,color:COLORS[1]},{label:'C',value:30,color:COLORS[2]}]});
  if(t==='bar') return Object.assign(base,{ bars:[{label:'Пн',value:4},{label:'Вт',value:6},{label:'Ср',value:3}]});
  if(t==='busy') return Object.assign(base,{ dayStart:8, dayEnd:22, blocks:[{label:'Работа',start:9,end:13,kind:'busy'},{label:'Свободно',start:13,end:15,kind:'free'},{label:'Встречи',start:15,end:18,kind:'busy'}]});
  if(t==='state') return Object.assign(base,{ states:['Новый','В работе','Готово'], edges:[{from:'Новый',to:'В работе',label:'старт'},{from:'В работе',to:'Готово',label:'готово'}]});
  if(t==='journey') return Object.assign(base,{ steps:[{name:'Узнал',emotion:2,note:''},{name:'Попробовал',emotion:3,note:''},{name:'Остался',emotion:5,note:''}]});
  if(t==='c4') return Object.assign(base,{ system:'Моя система', actors:[{name:'Пользователь',desc:''}], systems:[{name:'API',desc:''},{name:'БД',desc:''}], links:[]});
  return base;
}

function renderSvg(d){
  if(d.type==='pie'){
    const slices=(d.slices||[]).filter(s=>+s.value>0); const total=slices.reduce((a,s)=>a+(+s.value||0),0)||1;
    let a0=-Math.PI/2; const cx=120,cy=120,r=90;
    const paths=slices.map((s,i)=>{
      const a1=a0+(2*Math.PI*(+s.value/total));
      const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
      const large=(a1-a0)>Math.PI?1:0;
      const col=s.color||COLORS[i%COLORS.length];
      const path=`<path d="M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z" fill="${col}" stroke="#0004"/>`;
      a0=a1; return path;
    }).join('');
    const leg=slices.map((s,i)=>`<div class="leg"><i style="background:${s.color||COLORS[i%COLORS.length]}"></i>${esc(s.label)} <b>${Math.round(100*s.value/total)}%</b></div>`).join('');
    return {svg:`<svg viewBox="0 0 240 240">${paths}</svg>`,leg};
  }
  if(d.type==='bar'){
    const bars=d.bars||[]; const max=Math.max(1,...bars.map(b=>+b.value||0)); const w=300,h=160,pad=28,gap=8;
    const bw=bars.length?(w-pad*2-gap*(bars.length-1))/bars.length:20;
    const rects=bars.map((b,i)=>{
      const bh=((+b.value||0)/max)*(h-pad*2); const x=pad+i*(bw+gap); const y=h-pad-bh;
      return `<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(2,bh)}" rx="4" fill="#6366f1"/><text x="${x+bw/2}" y="${h-8}" text-anchor="middle" font-size="10" fill="#e2e8f0">${esc(b.label)}</text>`;
    }).join('');
    return {svg:`<svg viewBox="0 0 ${w} ${h}">${rects}</svg>`,leg:''};
  }
  if(d.type==='busy'){
    const start=+d.dayStart||8,end=+d.dayEnd||22,span=Math.max(1,end-start); const w=320,h=40+(d.blocks||[]).length*28;
    let axis=''; for(let h0=start;h0<=end;h0++){ const x=40+((h0-start)/span)*(w-50); axis+=`<text x="${x}" y="16" font-size="9" fill="#94a3b8" text-anchor="middle">${h0}</text>`; }
    const blocks=(d.blocks||[]).map((b,i)=>{
      const x=40+((+b.start-start)/span)*(w-50); const bw=Math.max(4,((+b.end-+b.start)/span)*(w-50)); const y=28+i*28;
      const col=b.kind==='free'?'#22c55e':'#6366f1';
      return `<rect x="${x}" y="${y}" width="${bw}" height="20" rx="6" fill="${col}"/><text x="${x+4}" y="${y+14}" font-size="10" fill="#fff">${esc(b.label)}</text>`;
    }).join('');
    return {svg:`<svg viewBox="0 0 ${w} ${Math.max(h,80)}">${axis}${blocks}</svg>`,leg:'<div class="leg"><i style="background:#6366f1"></i>Занято <i style="background:#22c55e;margin-left:8px"></i>Свободно</div>'};
  }
  if(d.type==='state'){
    const states=d.states||[], edges=d.edges||[]; const pos={};
    states.forEach((name,i)=>{ pos[name]={x:50+(i%3)*100,y:40+Math.floor(i/3)*70}; });
    const nodes=states.map(n=>{ const p=pos[n]; return `<rect x="${p.x-36}" y="${p.y-16}" width="72" height="32" rx="10" fill="#1e293b" stroke="#6366f1"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="10" fill="#e2e8f0">${esc(n)}</text>`; }).join('');
    const lines=edges.map(e=>{ const a=pos[e.from],b=pos[e.to]; if(!a||!b)return ''; return `<line x1="${a.x}" y1="${a.y+16}" x2="${b.x}" y2="${b.y-16}" stroke="#94a3b8" stroke-width="1.5"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-4}" font-size="9" fill="#94a3b8" text-anchor="middle">${esc(e.label||'')}</text>`; }).join('');
    return {svg:`<svg viewBox="0 0 320 200">${lines}${nodes}</svg>`,leg:''};
  }
  if(d.type==='journey'){
    const steps=d.steps||[]; const n=Math.max(1,steps.length); const gap=280/n;
    const pts=steps.map((s,i)=>({x:20+gap*i+gap/2,y:100-((+s.emotion||3)/5)*70,s}));
    const path=pts.map((p,i)=>(i?'L':'M')+p.x+','+p.y).join(' ');
    const dots=pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="8" fill="#6366f1"/><text x="${p.x}" y="128" text-anchor="middle" font-size="9" fill="#e2e8f0">${esc(p.s.name)}</text>`).join('');
    return {svg:`<svg viewBox="0 0 320 140"><path d="${path}" fill="none" stroke="#6366f1" stroke-width="2.5"/>${dots}</svg>`,leg:''};
  }
  if(d.type==='c4'){
    let html=`<rect x="100" y="80" width="120" height="50" rx="12" fill="#312e81" stroke="#818cf8"/><text x="160" y="110" text-anchor="middle" font-size="12" fill="#e2e8f0" font-weight="700">${esc(d.system||'System')}</text>`;
    (d.actors||[]).forEach((a,i)=>{ const x=20+i*100; html+=`<circle cx="${x+30}" cy="28" r="14" fill="#0f172a" stroke="#22c55e"/><text x="${x+30}" y="52" text-anchor="middle" font-size="9" fill="#e2e8f0">${esc(a.name)}</text><line x1="${x+30}" y1="42" x2="160" y2="80" stroke="#64748b" stroke-dasharray="3"/>`; });
    (d.systems||[]).forEach((s,i)=>{ const x=30+i*95; html+=`<rect x="${x}" y="160" width="80" height="36" rx="8" fill="#1e293b" stroke="#38bdf8"/><text x="${x+40}" y="182" text-anchor="middle" font-size="9" fill="#e2e8f0">${esc(s.name)}</text><line x1="160" y1="130" x2="${x+40}" y2="160" stroke="#64748b"/>`; });
    return {svg:`<svg viewBox="0 0 320 220">${html}</svg>`,leg:''};
  }
  return {svg:'',leg:''};
}

function paint(){
  const {svg,leg}=renderSvg(doc);
  document.getElementById('preview').innerHTML=svg+'<div class="legend">'+leg+'</div>';
  document.getElementById('title').textContent=TYPES[doc.type].title+' · '+(doc.title||'');
  try{ localStorage.setItem('contour-diagrams-current', JSON.stringify(doc)); }catch(e){}
}

function editorUI(){
  const el=document.getElementById('editor');
  const t=doc.type;
  let html=`<h3>${TYPES[t].title}</h3><p class="hint">${TYPES[t].hint}</p>
    <label>Название</label><input id="f-title" value="${esc(doc.title||'')}"/>`;
  if(t==='pie'){
    html+=`<div class="list" id="list">`+(doc.slices||[]).map((s,i)=>`<div class="item"><input data-i="${i}" data-k="label" value="${esc(s.label)}"/><input data-i="${i}" data-k="value" type="number" value="${s.value}"/><button data-del="${i}">×</button></div>`).join('')+`</div>
      <button class="btn ghost" type="button" id="add">+ доля</button>`;
  }
  if(t==='bar'){
    html+=`<div class="list">`+(doc.bars||[]).map((s,i)=>`<div class="item"><input data-i="${i}" data-k="label" value="${esc(s.label)}"/><input data-i="${i}" data-k="value" type="number" value="${s.value}"/><button data-del="${i}">×</button></div>`).join('')+`</div>
      <button class="btn ghost" type="button" id="add">+ столбец</button>`;
  }
  if(t==='busy'){
    html+=`<div class="row"><label>С</label><input id="ds" type="number" min="0" max="23" value="${doc.dayStart}"/><label>До</label><input id="de" type="number" min="1" max="24" value="${doc.dayEnd}"/></div>
      <div class="list">`+(doc.blocks||[]).map((b,i)=>`<div class="item" style="grid-template-columns:1fr 48px 48px 70px 36px">
        <input data-i="${i}" data-k="label" value="${esc(b.label)}"/>
        <input data-i="${i}" data-k="start" type="number" value="${b.start}"/>
        <input data-i="${i}" data-k="end" type="number" value="${b.end}"/>
        <select data-i="${i}" data-k="kind"><option value="busy"${b.kind==='busy'?' selected':''}>занято</option><option value="free"${b.kind==='free'?' selected':''}>свободно</option></select>
        <button data-del="${i}">×</button></div>`).join('')+`</div>
      <button class="btn ghost" type="button" id="add">+ блок</button>`;
  }
  if(t==='state'){
    html+=`<label>Состояния (через запятую)</label><input id="states" value="${esc((doc.states||[]).join(', '))}"/>
      <label>Переходы (из → в : подпись), по строке</label><textarea id="edges" rows="5">${esc((doc.edges||[]).map(e=>e.from+' → '+e.to+(e.label?(' : '+e.label):'')).join('\\n'))}</textarea>`;
  }
  if(t==='journey'){
    html+=`<div class="list">`+(doc.steps||[]).map((s,i)=>`<div class="item" style="grid-template-columns:1fr 56px 36px">
      <input data-i="${i}" data-k="name" value="${esc(s.name)}"/>
      <input data-i="${i}" data-k="emotion" type="number" min="1" max="5" value="${s.emotion}"/>
      <button data-del="${i}">×</button></div>`).join('')+`</div>
      <button class="btn ghost" type="button" id="add">+ этап</button>`;
  }
  if(t==='c4'){
    html+=`<label>Система</label><input id="sys" value="${esc(doc.system||'')}"/>
      <label>Акторы (через запятую)</label><input id="actors" value="${esc((doc.actors||[]).map(a=>a.name).join(', '))}"/>
      <label>Внешние системы (через запятую)</label><input id="systems" value="${esc((doc.systems||[]).map(a=>a.name).join(', '))}"/>`;
  }
  el.innerHTML=html;
  el.querySelector('#f-title')?.addEventListener('input',e=>{ doc.title=e.target.value; paint(); });
  el.querySelectorAll('[data-i]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const i=+inp.dataset.i, k=inp.dataset.k;
      const arr=doc.slices||doc.bars||doc.blocks||doc.steps;
      if(!arr||!arr[i]) return;
      arr[i][k]=inp.type==='number'?+inp.value:inp.value;
      paint();
    });
  });
  el.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.del;
      if(doc.slices) doc.slices.splice(i,1);
      if(doc.bars) doc.bars.splice(i,1);
      if(doc.blocks) doc.blocks.splice(i,1);
      if(doc.steps) doc.steps.splice(i,1);
      editorUI(); paint();
    };
  });
  el.querySelector('#add')?.addEventListener('click',()=>{
    if(doc.slices) doc.slices.push({label:'Новое',value:10,color:COLORS[doc.slices.length%COLORS.length]});
    if(doc.bars) doc.bars.push({label:'X',value:1});
    if(doc.blocks) doc.blocks.push({label:'Блок',start:10,end:12,kind:'busy'});
    if(doc.steps) doc.steps.push({name:'Этап',emotion:3,note:''});
    editorUI(); paint();
  });
  el.querySelector('#ds')?.addEventListener('input',e=>{ doc.dayStart=+e.target.value; paint(); });
  el.querySelector('#de')?.addEventListener('input',e=>{ doc.dayEnd=+e.target.value; paint(); });
  el.querySelector('#states')?.addEventListener('input',e=>{ doc.states=e.target.value.split(',').map(x=>x.trim()).filter(Boolean); paint(); });
  el.querySelector('#edges')?.addEventListener('input',e=>{
    doc.edges=e.target.value.split('\\n').map(line=>{
      const m=line.match(/(.+?)\\s*→\\s*([^:]+)(?::\\s*(.+))?/);
      return m?{from:m[1].trim(),to:m[2].trim(),label:(m[3]||'').trim()}:null;
    }).filter(Boolean);
    paint();
  });
  el.querySelector('#sys')?.addEventListener('input',e=>{ doc.system=e.target.value; paint(); });
  el.querySelector('#actors')?.addEventListener('input',e=>{ doc.actors=e.target.value.split(',').map(x=>({name:x.trim(),desc:''})).filter(a=>a.name); paint(); });
  el.querySelector('#systems')?.addEventListener('input',e=>{ doc.systems=e.target.value.split(',').map(x=>({name:x.trim(),desc:''})).filter(a=>a.name); paint(); });
}

function setType(t){
  doc=defaultDoc(t);
  document.querySelectorAll('.types button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  editorUI(); paint();
}

function postToParent(kind, extra){
  const msg=Object.assign({ t:'dg-to-agent', kind, name: doc.title||TYPES[doc.type].title, doc }, extra||{});
  try{ parent.postMessage(msg, '*'); }catch(e){}
}

document.getElementById('types').innerHTML=Object.keys(TYPES).map(t=>`<button type="button" data-t="${t}">${TYPES[t].title}</button>`).join('');
document.getElementById('types').onclick=e=>{ const b=e.target.closest('button[data-t]'); if(b) setType(b.dataset.t); };
document.getElementById('btn-new').onclick=()=>setType(doc.type);
document.getElementById('btn-agent').onclick=()=>postToParent('json');
document.getElementById('btn-copy').onclick=async()=>{
  try{ await navigator.clipboard.writeText(JSON.stringify(doc,null,2)); }catch(e){}
};
document.getElementById('btn-png').onclick=async()=>{
  const wrap=document.getElementById('preview');
  const svg=wrap.querySelector('svg');
  if(!svg) return;
  const xml=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([xml],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const c=document.createElement('canvas'); c.width=img.width*2||480; c.height=img.height*2||480;
    const ctx=c.getContext('2d'); ctx.fillStyle='#0b0f1a'; ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(img,0,0,c.width,c.height);
    const dataUrl=c.toDataURL('image/png');
    URL.revokeObjectURL(url);
    postToParent('png',{ dataUrl });
  };
  img.src=url;
};

window.addEventListener('message',e=>{
  if(!e.data||e.data.t!=='dg-open') return;
  if(e.data.doc) doc=e.data.doc;
  else setType(e.data.type||'pie');
  document.querySelectorAll('.types button').forEach(b=>b.classList.toggle('on',b.dataset.t===doc.type));
  editorUI(); paint();
});

try{
  const saved=JSON.parse(localStorage.getItem('contour-diagrams-current')||'null');
  if(saved&&saved.type) doc=saved; else doc=defaultDoc('pie');
}catch(e){ doc=defaultDoc('pie'); }
document.querySelectorAll('.types button').forEach(b=>b.classList.toggle('on',b.dataset.t===doc.type));
editorUI(); paint();
</script>
</body>
</html>
